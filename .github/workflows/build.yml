name: Build Subscription Repo

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，紧跟上游（hkbiang 北京 08:00 / to4kacc 每日 / sdyby2006 每 12h）刷新节奏
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # 支持手动触发
  push:
    paths:
      - "build.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write   # 用于把重建后的 blob 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate curated CN live source (rt_sync HTTP probe)
        # Actions 模式：跳过 clone/push，直接把实测筛选后的国内直播源写到 generated/iptv_cn_filtered.txt
        # 必须传 GH_TOKEN：rt_sync 拉取 github 系源（如 iptv-org 中国频道）需要 Bearer 鉴权，
        # 否则会被 GitHub API 限流导致「拉取失败」，最终单一直播源台数大幅缩水。
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LIVE_PROBE: ${{ vars.LIVE_PROBE }}
        run: python rt_sync.py --probe http --output iptv_cn_filtered.txt --github-actions --repo-path .

      - name: Generate clean spider-source subscription (build_sources)
        # 服务端汇总 ziyuanzu.com 当日检测 + 自建采集位置，过滤(NSFW/0资源) + 并发探测(浏览+搜索关键词)，
        # 生成 generated/sources.json 供 App 内置直接消费（替换 App 本地逐站检测，点击更新影视源秒级完成）。
        # 传 GH_TOKEN：上游 GitHub 订阅抓取加 Bearer 鉴权避免限流。
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python build_sources.py

      - name: Build encrypted blob
        env:
          RC4_KEY: ${{ secrets.RC4_KEY }}   # 留空则复用 App 端默认密钥（与 Rc4Util.KEY 一致）
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # 可选：GitHub PAT，给 github 系域名抓取加 Bearer 鉴权（避免限流/IP被标）
          LIVE_PROBE: ${{ vars.LIVE_PROBE }} # 可选：仓库变量设为 1 才开启「方案二 HTTP 探测」；默认关（先上方案一）
        run: python build.py --out dist

      - name: Commit & push rebuilt blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/repo.b64 dist/repo.json generated
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "chore: rebuild subscription blob ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
